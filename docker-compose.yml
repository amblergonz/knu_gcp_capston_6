version: '3.8'

# 저장소는 Redis 하나다.
# PostgreSQL·ClickHouse·model-api 는 어느 코드도 읽거나 쓰지 않아 제거했다.
# 분석 파이프라인을 다시 붙일 때는 실제로 쓰는 코드와 함께 되살릴 것.

services:
  # Streams · 세션 상태 · 개입 큐 · 런타임 설정
  redis:
    image: redis:7-alpine
    container_name: hover-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ingestion API (BE1)
  ingestion-api:
    build:
      context: ./packages/ingestion-api
      dockerfile: Dockerfile
    container_name: hover-ingestion-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Stream Worker (BE2) — 단일 인스턴스만 실행할 것.
  # consumer group 없이 XREAD 하므로 두 개를 띄우면 개입이 중복 발화한다.
  stream-worker:
    build:
      context: ./packages/stream-worker
      dockerfile: Dockerfile
    container_name: hover-stream-worker
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      THRESHOLDS_PATH: /app/config/thresholds.yml
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-10000}
      CONFIG_OVERRIDE_ENABLED: ${CONFIG_OVERRIDE_ENABLED:-true}
    volumes:
      - ./packages/shared/config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Decision API (BE2)
  decision-api:
    build:
      context: ./packages/decision-api
      dockerfile: Dockerfile
    container_name: hover-decision-api
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard API (BE3) — 집계 + 신호 튜닝 설정
  dashboard-api:
    build:
      context: ./packages/dashboard-api
      dockerfile: Dockerfile
    container_name: hover-dashboard-api
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      CONFIG_WRITE_ENABLED: ${CONFIG_WRITE_ENABLED:-true}
      CONFIG_WRITE_TOKEN: ${CONFIG_WRITE_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Demo Hotel Site (FE1)
  demo-hotel-site:
    build:
      context: ./packages/demo-hotel-site
      dockerfile: Dockerfile
    container_name: hover-demo-hotel-site
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_INGESTION_URL: http://localhost:4000
      NEXT_PUBLIC_DECISION_URL: http://localhost:4001
      NEXT_PUBLIC_DASHBOARD_API: http://localhost:4002
    depends_on:
      - ingestion-api
      - decision-api
      - dashboard-api
    restart: unless-stopped

  # Admin Dashboard (FE2)
  admin-dashboard:
    build:
      context: ./packages/admin-dashboard
      dockerfile: Dockerfile
    container_name: hover-admin-dashboard
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_DASHBOARD_API: http://localhost:4002
    depends_on:
      - dashboard-api
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: hover-network
